{# 管理员：用户投稿建议列表弹窗（样式内联，保证未加载 page_shells 的页面也能正常显示） #}
<style>
.hf-feedback-admin-modal.hf-feedback-modal {
    background:
        radial-gradient(ellipse 80% 60% at 50% 35%, rgba(125, 211, 252, 0.22) 0%, transparent 65%),
        linear-gradient(168deg, rgba(186, 230, 253, 0.32) 0%, rgba(226, 232, 240, 0.42) 100%);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
}
.hf-feedback-admin-modal .hf-feedback-modal__panel,
.hf-feedback-admin-modal__panel {
    max-width: min(38rem, 100%);
    padding: 0 !important;
    overflow: hidden;
    isolation: isolate;
    border: 1px solid rgba(255, 255, 255, 0.62) !important;
    border-radius: 0.95rem !important;
    background: linear-gradient(
        158deg,
        rgba(255, 255, 255, 0.62) 0%,
        rgba(255, 255, 255, 0.38) 52%,
        rgba(240, 249, 255, 0.48) 100%
    ) !important;
    backdrop-filter: blur(22px) saturate(1.35);
    -webkit-backdrop-filter: blur(22px) saturate(1.35);
    box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.88) inset,
        0 0 0 1px rgba(14, 116, 144, 0.06),
        0 20px 48px -18px rgba(14, 116, 144, 0.22),
        0 10px 28px -14px rgba(15, 28, 46, 0.12) !important;
}
.hf-feedback-admin-modal__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    min-height: 2.75rem;
    padding: 0.55rem 0.65rem 0.55rem 0.85rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.55);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.16) 100%);
}
.hf-feedback-admin-modal__head-main {
    display: flex;
    align-items: center;
    gap: 0.45rem;
    min-width: 0;
}
.hf-feedback-admin-modal .hf-feedback-modal__title,
.hf-feedback-admin-modal__head .hf-feedback-modal__title {
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: #0f172a;
}
.hf-feedback-admin-modal__count {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    padding: 0.12rem 0.45rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 600;
    line-height: 1.2;
    color: #475569;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.72);
    white-space: nowrap;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.hf-feedback-admin-modal .hf-feedback-modal__close {
    position: static;
    flex: 0 0 auto;
    width: 1.75rem;
    height: 1.75rem;
    border: none;
    border-radius: 0.45rem;
    background: rgba(255, 255, 255, 0.28);
    color: #64748b;
    box-shadow: none;
}
.hf-feedback-admin-modal .hf-feedback-modal__close svg {
    width: 14px;
    height: 14px;
}
.hf-feedback-admin-modal .hf-feedback-modal__close:hover {
    background: rgba(255, 255, 255, 0.55);
    color: #334155;
    border: none;
    box-shadow: none;
}
.hf-feedback-admin-modal .hf-feedback-modal__body,
.hf-feedback-admin-modal__body {
    display: flex;
    flex-direction: column;
    max-height: min(78vh, 42rem);
    overflow: hidden;
    margin: 0 !important;
    padding: 0.65rem 0.75rem 0.7rem !important;
    border: none !important;
    border-radius: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
}
.hf-feedback-admin-list {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    padding: 0.05rem 0.1rem 0.2rem 0;
    margin-bottom: 0.35rem;
    scrollbar-width: thin;
}
.hf-feedback-admin-loading,
.hf-feedback-admin-empty {
    margin: 1.25rem 0;
    text-align: center;
    font-size: 0.875rem;
    color: #64748b;
}
.hf-feedback-admin-empty.is-hidden {
    display: none !important;
}
.hf-feedback-admin-card {
    border-radius: 0.6rem;
    border: 1px solid rgba(255, 255, 255, 0.72);
    background: rgba(255, 255, 255, 0.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.65) inset;
    padding: 0.45rem 0.6rem;
}
.hf-feedback-admin-card__top {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    margin-bottom: 0.28rem;
}
.hf-feedback-admin-card__content {
    flex: 1 1 auto;
    min-width: 0;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 0.8125rem;
    line-height: 1.4;
    color: #0f172a;
    font-weight: 600;
}
.hf-feedback-admin-card__tag {
    flex: 0 0 auto;
    border-radius: 999px;
    padding: 0.08rem 0.42rem;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.35;
    white-space: nowrap;
}
.hf-feedback-admin-card__tag--sent {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid rgba(16, 185, 129, 0.28);
}
.hf-feedback-admin-card__tag--pending {
    background: #fff7ed;
    color: #c2410c;
    border: 1px solid rgba(251, 146, 60, 0.35);
}
.hf-feedback-admin-card__meta {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 0.35rem 0.55rem;
    min-width: 0;
    font-size: 0.7rem;
    color: #64748b;
    overflow: hidden;
}
.hf-feedback-admin-card__time {
    flex: 0 0 auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
}
.hf-feedback-admin-card__id {
    flex: 0 0 auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #475569;
    background: rgba(255, 255, 255, 0.45);
    border-radius: 0.3rem;
    padding: 0.04rem 0.28rem;
}
.hf-feedback-admin-card__chip {
    display: inline-flex;
    align-items: center;
    gap: 0.22rem;
    min-width: 0;
    max-width: 42%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #475569;
}
.hf-feedback-admin-card__chip--url {
    flex: 1 1 auto;
    max-width: none;
}
.hf-feedback-admin-card__chip em {
    flex: 0 0 auto;
    font-style: normal;
    font-weight: 700;
    color: #94a3b8;
}
.hf-feedback-admin-pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin: 0;
    padding: 0.45rem 0 0;
    border-top: 1px solid rgba(255, 255, 255, 0.5);
    background: transparent;
}
.hf-feedback-admin-page-info {
    font-size: 0.75rem;
    font-weight: 500;
    color: #475569;
    white-space: nowrap;
}
.hf-feedback-admin-modal .hf-feedback-admin-pager .btn {
    min-width: 4.25rem;
    padding: 0.32rem 0.65rem;
    font-size: 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.72);
    background: rgba(255, 255, 255, 0.42);
    color: #475569;
    cursor: pointer;
    font-weight: 600;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.hf-feedback-admin-modal .hf-feedback-admin-pager .btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.62);
    border-color: rgba(14, 116, 144, 0.22);
}
.hf-feedback-admin-modal .hf-feedback-admin-pager .btn:disabled {
    opacity: 0.42;
    cursor: not-allowed;
}
.hf-feedback-admin-card__images {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.4rem;
}
.hf-feedback-admin-card__images a {
    display: block;
    width: 3.1rem;
    height: 3.1rem;
    border-radius: 0.4rem;
    overflow: hidden;
    border: 1px solid rgba(203, 213, 225, 0.95);
    background: #f8fafc;
}
.hf-feedback-admin-card__images img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
</style>
<div id="hf-feedback-admin-modal" class="hf-feedback-modal hf-feedback-admin-modal hidden" role="dialog" aria-modal="true" aria-labelledby="hf-feedback-admin-title" aria-hidden="true">
    <div class="hf-feedback-modal__panel hf-feedback-admin-modal__panel" onclick="event.stopPropagation()">
        <header class="hf-feedback-admin-modal__head">
            <div class="hf-feedback-admin-modal__head-main">
                <h3 id="hf-feedback-admin-title" class="hf-feedback-modal__title">用户建议</h3>
                <span class="hf-feedback-admin-modal__count" id="hf-feedback-admin-desc">查看用户提交的投稿与建议</span>
            </div>
            <button type="button" class="hf-feedback-modal__close" data-hf-feedback-admin-close aria-label="关闭">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </header>
        <div class="hf-feedback-modal__body hf-feedback-admin-modal__body">
            <div id="hf-feedback-admin-list" class="hf-feedback-admin-list" aria-live="polite"></div>
            <p id="hf-feedback-admin-empty" class="hf-feedback-admin-empty is-hidden">暂无投稿建议</p>
            <p id="hf-feedback-admin-error" class="hf-feedback-modal__error hidden"></p>
            <div class="hf-feedback-admin-pager">
                <button type="button" class="btn btn-secondary" id="hf-feedback-admin-prev" disabled>上一页</button>
                <span id="hf-feedback-admin-page-info" class="hf-feedback-admin-page-info">—</span>
                <button type="button" class="btn btn-secondary" id="hf-feedback-admin-next" disabled>下一页</button>
            </div>
        </div>
    </div>
</div>
