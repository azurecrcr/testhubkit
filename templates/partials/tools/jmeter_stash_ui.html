{# JMeter 压测：账号级场景保存 UI（服务端按 user_id 隔离） #}

<div id="jm-stash-save-modal" class="fixed inset-0 z-[65] hidden items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h3 class="text-lg font-semibold text-slate-900">保存场景</h3>
        <label class="mt-3 block text-sm font-medium text-slate-700" for="jm-stash-save-title">场景名称 <span class="text-red-500">*</span></label>
        <input type="text" id="jm-stash-save-title" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm" maxlength="120" autocomplete="off" placeholder="例如：订单链路 v2">
        <div class="mt-6 flex justify-end gap-3">
            <button type="button" id="jm-stash-save-cancel" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700">取消</button>
            <button type="button" id="jm-stash-save-submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">保存</button>
        </div>
    </div>
</div>

<div id="jm-stash-list-modal" class="fixed inset-0 z-[65] hidden items-center justify-center bg-black/40 p-4">
    <div class="flex max-h-[85vh] w-full max-w-lg flex-col rounded-2xl bg-white shadow-2xl" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
            <h3 class="text-lg font-semibold text-slate-900">我的场景</h3>
            <button type="button" id="jm-stash-list-close" class="rounded-full p-2 text-slate-400 hover:bg-slate-100" aria-label="关闭">✕</button>
        </div>
        <div id="jm-stash-list" class="min-h-[8rem] overflow-y-auto p-2"></div>
    </div>
</div>

<div id="jm-stash-restore-modal" class="fixed inset-0 z-[66] hidden items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl" onclick="event.stopPropagation()">
        <h3 class="text-lg font-semibold text-slate-900">恢复场景</h3>
        <p id="jm-stash-restore-desc" class="mt-2 text-sm text-slate-600">当前已有场景内容，恢复将覆盖。</p>
        <div class="mt-6 flex flex-wrap justify-end gap-3">
            <button type="button" id="jm-stash-restore-cancel" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-semibold text-slate-700">取消</button>
            <button type="button" id="jm-stash-restore-overwrite" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white">覆盖当前场景</button>
        </div>
    </div>
</div>
