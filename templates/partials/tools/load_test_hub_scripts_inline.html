<script>
window.addEventListener('load', function () {
(function () {
    var TEMPLATES = {
        order: (typeof window.JMETER_ORDER_CHAIN_DEMO_YAML === 'string' && window.JMETER_ORDER_CHAIN_DEMO_YAML.trim())
            ? window.JMETER_ORDER_CHAIN_DEMO_YAML
            : '# 订单链路示例加载失败\nname: 订单创建链路\nthread_groups: []\n'
    };

    function applyScenarioYaml(yamlText) {
        if (!yamlInput) return;
        yamlInput.value = yamlText;
        syncPanelsFromYaml();
        if (window.JmsVisualBuilder) JmsVisualBuilder.loadTemplate(yamlText);
    }

    var yamlInput = document.getElementById('yaml-input');
    var outJmx = document.getElementById('out-jmx');
    var outReadme = document.getElementById('out-readme');
    var summaryBox = document.getElementById('summary-box');
    var summaryList = document.getElementById('summary-list');
    var _jmxImportParsedYaml = null;
    var _jmxImportParsedScenario = null;
    var _jmxImportRawBundle = null;
    var linkGrafana = document.getElementById('link-grafana');

    var lastScenario = null;
    var lastOutputs = { jmx: '', readme: '', scenarioSlug: '' };
    var activeTab = 'jmx';
    var importMode = 'curl';
    var importTarget = null;
    var httpAddChoiceTarget = null;
    var jmsConfirmCallback = null;
    var scenarioUserEdited = false;
    var suppressScenarioDirty = false;

    function markScenarioDirty() {
        if (scenarioUserEdited || suppressScenarioDirty) return;
        scenarioUserEdited = true;
        var wrap = document.getElementById('tpl-select-wrap');
        if (wrap) wrap.classList.add('hidden');
    }

    function showJmsConfirmDialog(opts) {
        var modal = document.getElementById('modal-jms-confirm');
        var titleEl = document.getElementById('modal-jms-confirm-title');
        var msgEl = document.getElementById('modal-jms-confirm-msg');
        var okBtn = document.getElementById('btn-jms-confirm-ok');
        if (!modal || !titleEl || !msgEl) return;
        var titleText = (opts && (opts.title || opts.heading)) ? String(opts.title || opts.heading) : '确认删除';
        var msgText = (opts && (opts.message || opts.msg || opts.text))
            ? String(opts.message || opts.msg || opts.text)
            : '确定要继续吗？';
        titleEl.textContent = titleText;
        msgEl.textContent = msgText;
        titleEl.style.cssText = 'display:block;visibility:visible;opacity:1;color:#065f46;-webkit-text-fill-color:#065f46;font-size:1.0625rem;font-weight:800;';
        msgEl.style.cssText = 'display:block;visibility:visible;opacity:1;color:#14532d;-webkit-text-fill-color:#14532d;font-size:0.875rem;font-weight:500;line-height:1.55;margin-top:0.55rem;white-space:pre-wrap;';
        if (okBtn) okBtn.textContent = (opts && opts.confirmText) ? opts.confirmText : '删除';
        jmsConfirmCallback = (opts && typeof opts.onConfirm === 'function') ? opts.onConfirm : null;
        modal.setAttribute('aria-hidden', 'false');
        modal.classList.add('jms-modal-open');
    }

    function closeJmsConfirmDialog() {
        var modal = document.getElementById('modal-jms-confirm');
        if (!modal) return;
        modal.classList.remove('jms-modal-open');
        modal.setAttribute('aria-hidden', 'true');
        jmsConfirmCallback = null;
    }

    function bindClick(id, handler) {
        var el = document.getElementById(id);
        if (!el) return false;
        el.addEventListener('click', handler);
        return true;
    }

    function toggleConfigPanel(panelId, btnId) {
        var panel = document.getElementById(panelId);
        var btn = document.getElementById(btnId);
        if (!panel || !btn) return;
        var pairs = [
            ['panel-quick', 'btn-panel-quick'],
            ['panel-load', 'btn-panel-load']
        ];
        var willOpen = !panel.classList.contains('is-open');
        pairs.forEach(function (p) {
            var pEl = document.getElementById(p[0]);
            var bEl = document.getElementById(p[1]);
            if (pEl) pEl.classList.remove('is-open');
            if (bEl) {
                bEl.classList.remove('is-active');
                bEl.setAttribute('aria-expanded', 'false');
            }
        });
        if (willOpen) {
            panel.classList.add('is-open');
            btn.classList.add('is-active');
            btn.setAttribute('aria-expanded', 'true');
        }
    }

    function setOutputActionsEnabled(_enabled) {}

    function openOutputModal(tab) {
        var modal = document.getElementById('modal-output');
        if (!modal) return;
        if (tab) setTab(tab);
        modal.setAttribute('aria-hidden', 'false');
        modal.classList.add('jms-modal-open');
    }

    function closeOutputModal() {
        var modal = document.getElementById('modal-output');
        if (!modal) return;
        modal.classList.remove('jms-modal-open');
        modal.setAttribute('aria-hidden', 'true');
    }

    function ensureGenerated() {
        if (!lastOutputs.jmx) {
            generateAll();
            return true;
        }
        return false;
    }

    function showMsg(text, ok) {
        if (typeof hfFloatToast !== 'function') return;
        hfFloatToast(text, {
            placement: 'top',
            variant: ok ? 'success' : 'error',
            duration: ok ? 3200 : 4500
        });
    }

    function slugify(name) {
        var s = String(name || 'scenario').toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-').replace(/^-+|-+$/g, '');
        return s || 'scenario';
    }

    function escapeXml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function parseBaseUrl(baseUrl) {
        var u = String(baseUrl || '').trim();
        if (!u) throw new Error('base_url 不能为空');
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        var url = new URL(u);
        var protocol = url.protocol.replace(':', '');
        var host = url.hostname;
        var port = url.port || (protocol === 'https' ? '443' : '80');
        return { protocol: protocol, host: host, port: port, origin: url.origin };
    }

    /** 新方法：允许空 base_url（场景监控已移除 / JMX 保真导入），不改动 parseBaseUrl */
    function parseBaseUrlForStudioExport(baseUrl) {
        if (window.JmsSceneMonitorValidateOptionalV1 &&
            typeof window.JmsSceneMonitorValidateOptionalV1.parseBaseUrlOptional === 'function') {
            return window.JmsSceneMonitorValidateOptionalV1.parseBaseUrlOptional(baseUrl);
        }
        var u = String(baseUrl || '').trim();
        if (!u) return { protocol: '', host: '', port: '', origin: '', empty: true };
        return parseBaseUrl(u);
    }

    /** 新方法：YAML 校验不强制 root base_url（保留 validateScenario 原语义） */
    function validateScenarioForStudio(raw) {
        var data;
        try { data = jsyaml.load(raw); } catch (e) { throw new Error('YAML 解析失败：' + (e.message || e)); }
        if (!data || typeof data !== 'object') throw new Error('根节点必须是对象');
        if (window.JmsSceneMonitorValidateOptionalV1 &&
            typeof window.JmsSceneMonitorValidateOptionalV1.prepareScenarioDataSkipLegacyScene === 'function') {
            data = window.JmsSceneMonitorValidateOptionalV1.prepareScenarioDataSkipLegacyScene(data);
        }
        var requireBase = window.JmsSceneMonitorValidateOptionalV1 &&
            typeof window.JmsSceneMonitorValidateOptionalV1.shouldRequireLegacySceneFields === 'function'
            ? window.JmsSceneMonitorValidateOptionalV1.shouldRequireLegacySceneFields(data)
            : !!(document.getElementById('btn-scene-monitor') || document.getElementById('modal-scene-monitor'));
        if (requireBase) {
            if (!data.base_url) throw new Error('缺少 base_url');
            parseBaseUrl(data.base_url);
        } else if (data.base_url) {
            parseBaseUrlForStudioExport(data.base_url);
        } else {
            data.base_url = data.base_url || '';
        }

        data.name = data.name || 'API Scenario';
        data.env = data.env ? String(data.env) : 'staging';
        data.build = data.build !== undefined ? String(data.build) : '${BUILD_ID}';
        data.default_headers = (data.default_headers && typeof data.default_headers === 'object') ? data.default_headers : {};
        data.variables = (data.variables && typeof data.variables === 'object') ? data.variables : {};
        normalizeInfluxRoot(data, data.name);

        mergeLegacyTestPlans(data);

        if (window.JmsPlanCatalogResolve && typeof window.JmsPlanCatalogResolve.migrateLegacyDataToCatalog === 'function') {
            window.JmsPlanCatalogResolve.migrateLegacyDataToCatalog(data);
        }

        if (Array.isArray(data.thread_groups) && data.thread_groups.length) {
            data.layout = 'scenario';
            var rootLoadFallback = (data.load && typeof data.load === 'object') ? data.load : null;
            if (Array.isArray(data.setup_thread_groups) && data.setup_thread_groups.length && window.JmxScenarioAdvanced) {
                data.setup_thread_groups = window.JmxScenarioAdvanced.normalizeSetupThreadGroups(
                    data.setup_thread_groups, rootLoadFallback, data
                );
            }
            if (Array.isArray(data.post_thread_groups) && data.post_thread_groups.length && window.JmxScenarioAdvanced) {
                data.post_thread_groups = window.JmxScenarioAdvanced.normalizePostThreadGroups(
                    data.post_thread_groups, rootLoadFallback, data
                );
            }
            data.thread_groups = data.thread_groups.map(function (tg, j) {
                var row = normalizeThreadGroup(tg, 'thread_groups[' + j + ']', rootLoadFallback, data);
                if (tg.processors) row.processors = tg.processors;
                if (Array.isArray(row.steps) && window.JmxScenarioAdvanced &&
                    row.steps.some(function (s) { return s && s.type === 'if_controller'; })) {
                    row.steps = window.JmxScenarioAdvanced.normalizeStepTree(row.steps, 'thread_groups[' + j + '].steps');
                }
                return row;
            });
            if (data.raw_jmx && data.raw_jmx.enabled && !data.execution_mode) data.execution_mode = 'raw_jmx';
            return data;
        }

        data.layout = 'single';
        data.load = normalizeLoad(data.load, 'load');
        data.steps = normalizeSteps(data.steps, 'steps');
        return data;
    }


    var _jmxExportPathOpts = { useBaseUrlVar: false };

    function setJmxExportPathContext(data) {
        if (!data) {
            _jmxExportPathOpts.useBaseUrlVar = false;
            return;
        }
        if (window.JmsPlanCatalogResolve && typeof window.JmsPlanCatalogResolve.resolvePlanVariablesFromData === 'function') {
            data.variables = window.JmsPlanCatalogResolve.resolvePlanVariablesFromData(data);
        } else {
            data.variables = (data.variables && typeof data.variables === 'object') ? data.variables : {};
        }
        if (!data.variables.BASE_URL && data.base_url) {
            data.variables.BASE_URL = String(data.base_url).replace(/\/$/, '');
        }
        _jmxExportPathOpts.useBaseUrlVar = !!data.variables.BASE_URL;
    }

    function resolveScenarioFromPlanCatalog(data) {
        if (window.JmsPlanCatalogResolve && typeof window.JmsPlanCatalogResolve.applyResolvedForExport === 'function') {
            return window.JmsPlanCatalogResolve.applyResolvedForExport(data);
        }
        return data;
    }

    function resolveStepPathForJmx(st) {
        if (window.JmsHttpPathQuery && typeof window.JmsHttpPathQuery.formatJmxExportPath === 'function') {
            return window.JmsHttpPathQuery.formatJmxExportPath(st, _jmxExportPathOpts);
        }
        if (window.JmsHttpPathQuery) return window.JmsHttpPathQuery.resolveJmxSamplerPath(st);
        return String(st.path || '/') + buildQueryString(st.query);
    }

    function httpStepEnabledAttr(st) {
        return st && st.enabled === false ? 'false' : 'true';
    }

    function jmxSamplerEnabledAttr(st) {
        if (window.JmsJmxExportCompact) {
            return window.JmsJmxExportCompact.enabledAttr(st && st.enabled !== false);
        }
        return ' enabled="' + httpStepEnabledAttr(st) + '"';
    }

    function buildQueryString(query) {
        if (!query) return '';
        var p = new URLSearchParams();
        Object.keys(query).forEach(function (k) {
            var v = query[k];
            if (v !== undefined && v !== null) p.append(k, String(v));
        });
        var s = p.toString();
        return s ? '?' + s : '';
    }

    var ASSERT_TYPES = {
        status: { label: '响应状态码', placeholder: '200', hint: '等于指定 HTTP 状态码' },
        contains: { label: '响应包含文本', placeholder: 'success', hint: '响应体包含该字符串' },
        not_contains: { label: '响应不包含', placeholder: 'error', hint: '响应体不包含该字符串' },
        duration: { label: '响应时间(ms)', placeholder: '3000', hint: '响应时间不超过该毫秒数' },
        json: { label: 'JSON 断言', placeholder: 'JSONPath', hint: 'JSONPath 匹配' },
        xml: { label: 'XML 断言', placeholder: 'XPath', hint: 'XML XPath' },
        xpath: { label: 'XPath 断言', placeholder: 'XPath', hint: 'HTML XPath' },
        size: { label: '大小断言(bytes)', placeholder: '1024', hint: '响应大小' },
        jsr223_assert: { label: 'JSR223 断言', placeholder: '脚本', hint: 'JSR223 脚本断言' }
    };

    function normalizeAssertionItem(a, label) {
        if (!a || typeof a !== 'object') return null;
        var type = String(a.type || '').trim();
        if (!ASSERT_TYPES[type]) return null;
        if (type === 'jsr223_assert') {
            var script = a.script !== undefined ? String(a.script) : String(a.value || '');
            if (!script.trim()) return null;
            return {
                type: 'jsr223_assert',
                name: a.name ? String(a.name) : 'JSR223 断言',
                script: script,
                language: a.language ? String(a.language) : 'groovy',
                enabled: a.enabled !== false
            };
        }
        var value = a.value !== undefined && a.value !== null ? String(a.value).trim() : '';
        if (!value) return null;
        if (type === 'status' || type === 'duration') {
            var n = Number(value);
            if (!Number.isFinite(n)) throw new Error(label + ' 的断言值必须是数字');
            value = String(Math.floor(n));
        }
        var item = { type: type, value: value };
        if (a.expected !== undefined && a.expected !== null && String(a.expected).trim()) {
            item.expected = String(a.expected).trim();
        }
        if (a.operator) item.operator = String(a.operator);
        if (a.custom_message !== undefined && a.custom_message !== null && String(a.custom_message).trim()) {
            item.custom_message = String(a.custom_message).trim();
        }
        if (a.jmeter_test_type !== undefined && a.jmeter_test_type !== null && !isNaN(Number(a.jmeter_test_type))) {
            item.jmeter_test_type = Number(a.jmeter_test_type);
        }
        if (a.jmeter_test_field) item.jmeter_test_field = String(a.jmeter_test_field);
        if (a.jmeter_name) item.jmeter_name = String(a.jmeter_name);
        return item;
    }

    function collectStepAssertions(step) {
        if (window.JmsStepAssertResolver && typeof window.JmsStepAssertResolver.getStepAssertions === 'function') {
            return window.JmsStepAssertResolver.getStepAssertions(step);
        }
        var list = [];
        if (Array.isArray(step.assertions)) {
            step.assertions.forEach(function (a, i) {
                var item = normalizeAssertionItem(a, 'assertions[' + i + ']');
                if (item) list.push(item);
            });
        }
        return list;
    }

    function genAssertionXml(assertion, samplerName, childPad) {
        if (window.JmsAssertionExportIncludeDisabledV1 && typeof window.JmsAssertionExportIncludeDisabledV1.genAssertionXml === 'function') {
            return window.JmsAssertionExportIncludeDisabledV1.genAssertionXml(assertion, samplerName, childPad, escapeXml);
        }
        var xml = '';
        if (assertion.type === 'response_assert' &&
            window.JmsHttpResponseAssertionJmx && typeof window.JmsHttpResponseAssertionJmx.genXml === 'function') {
            return window.JmsHttpResponseAssertionJmx.genXml(assertion, childPad, escapeXml);
        }
        if (assertion.type === 'json_assert' &&
            window.JmsHttpJsonAssertionJmx && typeof window.JmsHttpJsonAssertionJmx.genXml === 'function') {
            return window.JmsHttpJsonAssertionJmx.genXml(assertion, childPad, escapeXml);
        }
        if (assertion.type === 'size_assert' &&
            window.JmsHttpSizeAssertionJmx && typeof window.JmsHttpSizeAssertionJmx.genXml === 'function') {
            return window.JmsHttpSizeAssertionJmx.genXml(assertion, childPad, escapeXml);
        }
        if (assertion.type === 'md5hex_assert' &&
            window.JmsHttpMd5hexAssertionJmx && typeof window.JmsHttpMd5hexAssertionJmx.genXml === 'function') {
            return window.JmsHttpMd5hexAssertionJmx.genXml(assertion, childPad, escapeXml);
        }
        var testName = escapeXml(assertion.type + ' ' + assertion.value + ' ' + samplerName);
        if ((assertion.type === 'status' || assertion.type === 'contains' || assertion.type === 'not_contains') &&
            window.JmxResponseAssertion && typeof window.JmxResponseAssertion.genXml === 'function') {
            xml += window.JmxResponseAssertion.genXml(assertion, samplerName, childPad, escapeXml);
        } else if (assertion.type === 'status') {
            xml += childPad + '<ResponseAssertion guiclass="AssertionGui" testclass="ResponseAssertion" testname="' + testName + '" enabled="true">\n';
            xml += childPad + '  <collectionProp name="Assertion.test_strings">\n';
            xml += childPad + '    <stringProp name="0">' + escapeXml(assertion.value) + '</stringProp>\n';
            xml += childPad + '  </collectionProp>\n';
            xml += childPad + '  <stringProp name="Assertion.custom_message"></stringProp>\n';
            xml += childPad + '  <stringProp name="Assertion.test_field">Assertion.response_code</stringProp>\n';
            xml += childPad + '  <boolProp name="Assertion.assume_success">false</boolProp>\n';
            xml += childPad + '  <intProp name="Assertion.test_type">8</intProp>\n';
            xml += childPad + '</ResponseAssertion>\n';
            xml += childPad + '<hashTree/>\n';
        } else if (assertion.type === 'contains' || assertion.type === 'not_contains') {
            var testType = assertion.type === 'contains' ? '2' : '6';
            xml += childPad + '<ResponseAssertion guiclass="AssertionGui" testclass="ResponseAssertion" testname="' + testName + '" enabled="true">\n';
            xml += childPad + '  <collectionProp name="Assertion.test_strings">\n';
            xml += childPad + '    <stringProp name="0">' + escapeXml(assertion.value) + '</stringProp>\n';
            xml += childPad + '  </collectionProp>\n';
            xml += childPad + '  <stringProp name="Assertion.custom_message"></stringProp>\n';
            xml += childPad + '  <stringProp name="Assertion.test_field">Assertion.response_data</stringProp>\n';
            xml += childPad + '  <boolProp name="Assertion.assume_success">false</boolProp>\n';
            xml += childPad + '  <intProp name="Assertion.test_type">' + testType + '</intProp>\n';
            xml += childPad + '</ResponseAssertion>\n';
            xml += childPad + '<hashTree/>\n';
        } else if (assertion.type === 'duration') {
            xml += childPad + '<DurationAssertion guiclass="DurationAssertionGui" testclass="DurationAssertion" testname="' + testName + '" enabled="true">\n';
            xml += childPad + '  <stringProp name="DurationAssertion.duration">' + escapeXml(assertion.value) + '</stringProp>\n';
            xml += childPad + '</DurationAssertion>\n';
            xml += childPad + '<hashTree/>\n';
        } else if (assertion.type === 'jsr223_assert' &&
            window.JmxJsr223Assertion && typeof window.JmxJsr223Assertion.genXml === 'function') {
            xml += window.JmxJsr223Assertion.genXml(assertion, samplerName, childPad, escapeXml);
        } else if (window.JmeterJmxExtra && ['json', 'xml', 'xpath', 'size'].indexOf(assertion.type) >= 0) {
            xml += window.JmeterJmxExtra.genExtendedAssertionXml(assertion, samplerName, childPad, escapeXml);
        }
        return xml;
    }

    function normalizeLoad(load, label, fallbackLoad) {
        label = label || 'load';
        var src = (load && typeof load === 'object') ? load : ((fallbackLoad && typeof fallbackLoad === 'object') ? fallbackLoad : {});
        var out = {};
        var users = Number(src.users);
        if (!Number.isFinite(users) || users < 1) throw new Error(label + '.users 必须是 >= 1 的数字');
        out.users = Math.floor(users);
        out.spawn_rate = Math.max(1, Math.floor(Number(src.spawn_rate) || 1));
        var dur = src.duration_sec !== undefined ? src.duration_sec : src.run_time_sec;
        if (dur === undefined || dur === null || dur === '') throw new Error(label + '.duration_sec 必填');
        out.duration_sec = Math.max(1, Math.floor(Number(dur)));
        out.loops = src.loops !== undefined ? Number(src.loops) : -1;
        if (!Number.isFinite(out.loops)) out.loops = -1;
        return out;
    }

    function resolveStepBodyType(step) {
        var t = step.body_type ? String(step.body_type).toLowerCase() : '';
        if (['none', 'json', 'form', 'multipart'].indexOf(t) >= 0) return t;
        if (step.multipart && typeof step.multipart === 'object') return 'multipart';
        if (step.form_params && typeof step.form_params === 'object' && Object.keys(step.form_params).length) return 'form';
        if (step.body !== undefined && step.body !== null && String(step.body).trim()) return 'json';
        return 'none';
    }

    function normalizeStepBody(step, stepLabel, method) {
        var bodyType = resolveStepBodyType(step);
        if (['POST', 'PUT', 'PATCH'].indexOf(method) < 0) bodyType = 'none';
        var encoding = step.encoding !== undefined && step.encoding !== null ? String(step.encoding).trim() : '';
        var out = {
            body_type: bodyType,
            body: null,
            form_params: null,
            multipart: null
        };
        if (encoding) out.encoding = encoding;
        if (bodyType === 'json') {
            out.body = (step.body === undefined || step.body === null) ? '' : String(step.body);
        } else if (bodyType === 'form') {
            var fp = (step.form_params && typeof step.form_params === 'object') ? step.form_params : {};
            out.form_params = fp;
        } else if (bodyType === 'multipart') {
            var mp = (step.multipart && typeof step.multipart === 'object') ? step.multipart : {};
            var fields = (mp.fields && typeof mp.fields === 'object') ? mp.fields : {};
            var files = Array.isArray(mp.files) ? mp.files : [];
            files = files.map(function (f, fi) {
                if (!f || typeof f !== 'object') throw new Error(stepLabel + '.multipart.files[' + fi + '] 无效');
                var param = String(f.param || f.paramname || '').trim();
                var path = String(f.path || '').trim();
                if (!param) throw new Error(stepLabel + '.multipart.files[' + fi + '].param 必填');
                if (!path) throw new Error(stepLabel + '.multipart.files[' + fi + '].path 必填');
                return {
                    param: param,
                    path: path,
                    mime: f.mime || f.mimetype ? String(f.mime || f.mimetype) : ''
                };
            });
            out.multipart = { fields: fields, files: files };
        }
        return out;
    }

    function normalizeHttpStep(step, stepLabel) {
        if (!step || typeof step !== 'object') throw new Error(stepLabel + ' 必须是对象');
        var name = step.name || 'HTTP 请求';
        var method = String(step.method || 'GET').toUpperCase();
        var path = String(step.path || '/');
        var query = (step.query && typeof step.query === 'object') ? step.query :
            ((step.query_params && typeof step.query_params === 'object') ? step.query_params : null);
        if (window.JmsHttpPathQuery) path = window.JmsHttpPathQuery.mergePathAndQuery(path, query);
        if (!path.startsWith('/')) throw new Error(stepLabel + '.path 建议以 / 开头');
        var headers = (step.headers && typeof step.headers === 'object') ? step.headers : {};
        var bodyNorm = normalizeStepBody(step, stepLabel, method);
        var extract = null;
        if (step.extract) {
            if (typeof step.extract !== 'object' || !step.extract.json_path || !step.extract.var) {
                throw new Error(stepLabel + '.extract 需要 json_path 与 var');
            }
            extract = { json_path: String(step.extract.json_path), var: String(step.extract.var) };
        }
        var assertions = collectStepAssertions(step);
        var assertStatus = null;
        assertions.forEach(function (a) {
            if (a.type === 'status') assertStatus = Number(a.value);
        });
        var row = {
            name: name, method: method, path: path, query: null, headers: headers,
            body_type: bodyNorm.body_type, body: bodyNorm.body,
            extract: extract, assert_status: assertStatus, assertions: assertions,
            enabled: step.enabled !== false
        };
        if (bodyNorm.encoding) row.encoding = bodyNorm.encoding;
        if (bodyNorm.form_params) row.form_params = bodyNorm.form_params;
        if (bodyNorm.multipart) row.multipart = bodyNorm.multipart;
        if (step.extractors && Array.isArray(step.extractors)) row.extractors = step.extractors;
        if (step.processors && Array.isArray(step.processors)) row.processors = step.processors;
        if (step.step_listeners && typeof step.step_listeners === 'object') row.step_listeners = step.step_listeners;
        if (step.constant_timer && typeof step.constant_timer === 'object') row.constant_timer = step.constant_timer;
        if (step.user_parameters && typeof step.user_parameters === 'object') row.user_parameters = step.user_parameters;

    function normalizeSteps(steps, label) {
        label = label || 'steps';
        if (!Array.isArray(steps) || !steps.length) throw new Error(label + ' 必须是非空数组');
        var EV = window.JmsExportValidateStepsV1;
        if (EV && typeof EV.shouldUseTreeNormalize === 'function' && EV.shouldUseTreeNormalize(steps)) {
            if (window.JmxScenarioAdvanced && typeof window.JmxScenarioAdvanced.normalizeStepTree === 'function') {
                return window.JmxScenarioAdvanced.normalizeStepTree(steps, label);
            }
        }
        if (window.JmxScenarioAdvanced && steps.some(function (s) {
            return s && (s.type === 'if_controller' || s.type === 'debug_sampler' || s.type === 'beanshell_post');
        })) {
            return window.JmxScenarioAdvanced.normalizeStepTree(steps, label);

    function normalizeInfluxRoot(data, defaultName) {
        data.influxdb = (data.influxdb && typeof data.influxdb === 'object') ? data.influxdb : {};
        if (data.influxdb.enabled !== false) {
            data.influxdb.enabled = true;
            if (!data.influxdb.url) throw new Error('influxdb.url 不能为空');
            if (!data.influxdb.application) throw new Error('influxdb.application 必填（Grafana 主维度）');
            data.influxdb.measurement = data.influxdb.measurement || 'jmeter';
            data.influxdb.tags = (data.influxdb.tags && typeof data.influxdb.tags === 'object') ? data.influxdb.tags : {};

                data.influxdb.tags.scenario = slugify(defaultName || data.name || 'API Scenario');

    function normalizeThreadGroup(tg, tgLabel, rootLoadFallback, data) {
        if (!tg || typeof tg !== 'object') throw new Error(tgLabel + ' 必须是对象');
        tg.name = tg.name ? String(tg.name) : '线程组';
        tg.variables = (tg.variables && typeof tg.variables === 'object') ? tg.variables : {};
        tg.load = normalizeLoad(tg.load, tgLabel + '.load', rootLoadFallback);
        tg.steps = normalizeSteps(tg.steps, tgLabel + '.steps');
        var tgInf = (tg.influxdb && typeof tg.influxdb === 'object') ? tg.influxdb : {};
        tg.influxdb = { tags: (tgInf.tags && typeof tgInf.tags === 'object') ? tgInf.tags : {} };
        if (!tg.influxdb.tags.scenario) tg.influxdb.tags.scenario = slugify(tg.name || data.name);
        if (!tg.influxdb.tags.env) tg.influxdb.tags.env = data.env;
        tg.http_managers = normalizeHttpManagers(tg.http_managers);
        tg.listeners = (tg.listeners && typeof tg.listeners === 'object') ? tg.listeners : {};
        if (tg.config_timeline_active === true) tg.config_timeline_active = true;
        if (Array.isArray(tg.config_items)) tg.config_items = tg.config_items.slice();
        if (Array.isArray(tg.removed_config_types)) tg.removed_config_types = tg.removed_config_types.slice();
        return tg;

    function mergeLegacyTestPlans(data) {
        if (!Array.isArray(data.test_plans) || !data.test_plans.length) return;
        var rootLoadFallback = (data.load && typeof data.load === 'object') ? data.load : null;
        var mergedTgs = [];
        data.test_plans.forEach(function (plan, i) {
            if (!plan || typeof plan !== 'object') throw new Error('test_plans[' + i + '] 必须是对象');
            var label = 'test_plans[' + i + ']';
            plan.variables = (plan.variables && typeof plan.variables === 'object') ? plan.variables : {};
            Object.keys(plan.variables).forEach(function (k) {
                if (data.variables[k] === undefined) data.variables[k] = plan.variables[k];
            });
            if (Array.isArray(plan.thread_groups) && plan.thread_groups.length) {
                plan.thread_groups.forEach(function (tg, j) {
                    mergedTgs.push(normalizeThreadGroup(tg, label + '.thread_groups[' + j + ']', rootLoadFallback, data));
                });
            } else {
                plan.load = normalizeLoad(plan.load, label + '.load', rootLoadFallback);
                plan.steps = normalizeSteps(plan.steps, label + '.steps');
                mergedTgs.push(normalizeThreadGroup({
                    name: plan.name || ('线程组 ' + (i + 1)),
                    load: plan.load,
                    variables: plan.variables,
                    steps: plan.steps,
                    influxdb: plan.influxdb
                }, label, rootLoadFallback, data));
            }
        });
        if (!data.name && data.test_plans[0] && data.test_plans[0].name) {
            data.name = data.test_plans[0].name;
        }
        data.thread_groups = mergedTgs;
        delete data.test_plans;

    function validateScenario(raw) {
        var data;
        try { data = jsyaml.load(raw); } catch (e) { throw new Error('YAML 解析失败：' + (e.message || e)); }
        if (!data || typeof data !== 'object') throw new Error('根节点必须是对象');
        if (!data.base_url) throw new Error('缺少 base_url');
        parseBaseUrl(data.base_url);

        data.name = data.name || 'API Scenario';
        data.env = data.env ? String(data.env) : 'staging';
        data.build = data.build !== undefined ? String(data.build) : '${BUILD_ID}';
        data.default_headers = (data.default_headers && typeof data.default_headers === 'object') ? data.default_headers : {};
        data.variables = (data.variables && typeof data.variables === 'object') ? data.variables : {};
        normalizeInfluxRoot(data, data.name);

        mergeLegacyTestPlans(data);

        if (window.JmsPlanCatalogResolve && typeof window.JmsPlanCatalogResolve.migrateLegacyDataToCatalog === 'function') {
            window.JmsPlanCatalogResolve.migrateLegacyDataToCatalog(data);
        }

        if (Array.isArray(data.thread_groups) && data.thread_groups.length) {
            data.layout = 'scenario';
            var rootLoadFallback = (data.load && typeof data.load === 'object') ? data.load : null;
            if (Array.isArray(data.setup_thread_groups) && data.setup_thread_groups.length && window.JmxScenarioAdvanced) {
                data.setup_thread_groups = window.JmxScenarioAdvanced.normalizeSetupThreadGroups(
                    data.setup_thread_groups, rootLoadFallback, data
                );
            }
            if (Array.isArray(data.post_thread_groups) && data.post_thread_groups.length && window.JmxScenarioAdvanced) {
                data.post_thread_groups = window.JmxScenarioAdvanced.normalizePostThreadGroups(
                    data.post_thread_groups, rootLoadFallback, data
                );
            }
            data.thread_groups = data.thread_groups.map(function (tg, j) {
                var row = normalizeThreadGroup(tg, 'thread_groups[' + j + ']', rootLoadFallback, data);
                if (tg.processors) row.processors = tg.processors;
                if (Array.isArray(row.steps) && window.JmxScenarioAdvanced &&
                    row.steps.some(function (s) { return s && s.type === 'if_controller'; })) {
                    row.steps = window.JmxScenarioAdvanced.normalizeStepTree(row.steps, 'thread_groups[' + j + '].steps');
                }
                return row;
            });
            if (data.raw_jmx && data.raw_jmx.enabled && !data.execution_mode) data.execution_mode = 'raw_jmx';
            return data;
        }

        data.layout = 'single';
        data.load = normalizeLoad(data.load, 'load');
        data.steps = normalizeSteps(data.steps, 'steps');
        return data;
    }

    function influxDataForPlan(root, plan, tg) {

    function countScenarioSteps(data) {
        if (window.JmxScenarioAdvanced) {
            var n = 0;
            (data.setup_thread_groups || []).forEach(function (tg) { n += window.JmxScenarioAdvanced.countStepsRecursive(tg.steps); });
            (data.post_thread_groups || []).forEach(function (tg) { n += window.JmxScenarioAdvanced.countStepsRecursive(tg.steps); });

                data.thread_groups.forEach(function (tg) { n += window.JmxScenarioAdvanced.countStepsRecursive(tg.steps); });

            }
            if (data.steps) return window.JmxScenarioAdvanced.countStepsRecursive(data.steps);

        if (data.layout === 'scenario' && Array.isArray(data.thread_groups)) {
            return data.thread_groups.reduce(function (n, tg) { return n + (tg.steps ? tg.steps.length : 0); }, 0);

    function backendListenerXml(data, indent, tgBackendCfg) {
        if (tgBackendCfg && window.JmsBackendListenerJmx && typeof window.JmsBackendListenerJmx.genBackendListenerXml === 'function') {
            return window.JmsBackendListenerJmx.genBackendListenerXml(tgBackendCfg, indent, escapeXml);
        }
        if (!data.influxdb || data.influxdb.enabled === false) return '';
        var pad = indent || '        ';
        var pad2 = pad + '  ';
        var pad3 = pad2 + '  ';
        var pad4 = pad3 + '  ';
        var inf = data.influxdb;
        var tags = inf.tags || {};
        var eventTags = [];
        if (tags.scenario) eventTags.push('scenario=' + tags.scenario);
        if (tags.env || data.env) eventTags.push('env=' + (tags.env || data.env));
        eventTags.push('build=${__P(build,unknown)}');
        var eventTagsStr = eventTags.join(',');

        var args = [
            ['influxdbMetricsSender', 'org.apache.jmeter.visualizers.backend.influxdb.HttpMetricsSender'],
            ['influxdbUrl', inf.url],
            ['application', inf.application],
            ['measurement', inf.measurement || 'jmeter'],
            ['summaryOnly', 'false'],
            ['samplersRegex', '.*'],
            ['percentiles', '99;95;90'],
            ['testTitle', data.name],
            ['eventTags', eventTagsStr]
        ];
        var xml = pad + '<BackendListener guiclass="BackendListenerGui" testclass="BackendListener" testname="InfluxDB Backend Listener" enabled="true">\n';
        xml += pad2 + '<elementProp name="arguments" elementType="Arguments" guiclass="ArgumentsPanel" testclass="Arguments" testname="Arguments" enabled="true">\n';
        xml += pad3 + '<collectionProp name="Arguments.arguments">\n';
        args.forEach(function (pair) {
            xml += pad4 + '<elementProp name="' + escapeXml(pair[0]) + '" elementType="Argument">\n';
            xml += pad4 + '  <stringProp name="Argument.name">' + escapeXml(pair[0]) + '</stringProp>\n';
            xml += pad4 + '  <stringProp name="Argument.value">' + escapeXml(pair[1]) + '</stringProp>\n';
            xml += pad4 + '  <stringProp name="Argument.metadata">=</stringProp>\n';
            xml += pad4 + '</elementProp>\n';
        });
        xml += pad3 + '</collectionProp>\n';
        xml += pad2 + '</elementProp>\n';
        xml += pad2 + '<stringProp name="classname">org.apache.jmeter.visualizers.backend.influxdb.InfluxdbBackendListenerClient</stringProp>\n';
        xml += pad + '</BackendListener>\n';
        xml += pad + '<hashTree/>\n';
        return xml;
    }

    function genNamedHttpArgument(indent, name, value, alwaysEncode) {
        if (window.JmsJmxExportCompact) {
            return window.JmsJmxExportCompact.httpNamedArgument(indent, name, value, alwaysEncode, escapeXml);
        }
        return indent + '<elementProp name="' + escapeXml(name) + '" elementType="HTTPArgument">\n' +

    function genHttpSamplerBodyXml(st, indent, method) {
        var bodyType = resolveStepBodyType(st);
        var methodUp = String(method || 'GET').toUpperCase();
        if (['POST', 'PUT', 'PATCH'].indexOf(methodUp) < 0) {
            if ((methodUp === 'GET' || methodUp === 'HEAD') &&
                window.JmsJmxGetBodyImport &&
                typeof window.JmsJmxGetBodyImport.shouldExportGetHeadBody === 'function' &&
                window.JmsJmxGetBodyImport.shouldExportGetHeadBody(st)) {
                /* 保留 JMX 导入的 GET/HEAD body */
            } else {
                bodyType = 'none';
            }
        }
        var xml = '';
        var multipart = false;

        if (bodyType === 'json' && st.body !== null && st.body !== undefined && String(st.body).length) {
            xml += indent + '  <boolProp name="HTTPSampler.postBodyRaw">true</boolProp>\n';
            xml += indent + '  <elementProp name="HTTPsampler.Arguments" elementType="Arguments">\n';
            xml += indent + '    <collectionProp name="Arguments.arguments">\n';
            xml += indent + '      <elementProp name="" elementType="HTTPArgument">\n';
            xml += indent + '        <boolProp name="HTTPArgument.always_encode">false</boolProp>\n';
            xml += indent + '        <stringProp name="Argument.value">' + escapeXml(st.body) + '</stringProp>\n';
            xml += indent + '        <stringProp name="Argument.metadata">=</stringProp>\n';
            xml += indent + '      </elementProp>\n';
            xml += indent + '    </collectionProp>\n';
            xml += indent + '  </elementProp>\n';
            return { xml: xml, multipart: false };
        }

        if (bodyType === 'form' && st.form_params && typeof st.form_params === 'object') {
            xml += indent + '  <boolProp name="HTTPSampler.postBodyRaw">false</boolProp>\n';
            xml += indent + '  <elementProp name="HTTPsampler.Arguments" elementType="Arguments" guiclass="HTTPArgumentsPanel" testclass="Arguments" testname="User Defined Variables" enabled="true">\n';
            xml += indent + '    <collectionProp name="Arguments.arguments">\n';
            Object.keys(st.form_params).forEach(function (k) {
                xml += genNamedHttpArgument(indent + '      ', k, st.form_params[k], true);
            });
            xml += indent + '    </collectionProp>\n';
            xml += indent + '  </elementProp>\n';
            return { xml: xml, multipart: false };
        }

        if (bodyType === 'multipart' && st.multipart && typeof st.multipart === 'object') {
            multipart = true;
            var fields = st.multipart.fields || {};
            var files = Array.isArray(st.multipart.files) ? st.multipart.files : [];
            xml += indent + '  <boolProp name="HTTPSampler.postBodyRaw">false</boolProp>\n';
            if (files.length) {
                xml += indent + '  <elementProp name="HTTPsampler.Files" elementType="HTTPFileArgs">\n';
                xml += indent + '    <collectionProp name="HTTPFileArgs.files">\n';
                files.forEach(function (f, fi) {
                    var param = f.param || f.paramname || ('file' + fi);
                    xml += indent + '      <elementProp name="' + escapeXml(param) + '" elementType="HTTPFileArg">\n';
                    xml += indent + '        <stringProp name="File.path">' + escapeXml(f.path || '') + '</stringProp>\n';
                    xml += indent + '        <stringProp name="File.paramname">' + escapeXml(param) + '</stringProp>\n';
                    xml += indent + '        <stringProp name="File.mimetype">' + escapeXml(f.mime || f.mimetype || '') + '</stringProp>\n';
                    xml += indent + '      </elementProp>\n';
                });
                xml += indent + '    </collectionProp>\n';
                xml += indent + '  </elementProp>\n';
            }
            xml += indent + '  <elementProp name="HTTPsampler.Arguments" elementType="Arguments" guiclass="HTTPArgumentsPanel" testclass="Arguments" testname="User Defined Variables" enabled="true">\n';
            xml += indent + '    <collectionProp name="Arguments.arguments">\n';
            Object.keys(fields).forEach(function (k) {
                xml += genNamedHttpArgument(indent + '      ', k, fields[k], false);
            });
            xml += indent + '    </collectionProp>\n';
            xml += indent + '  </elementProp>\n';
            return { xml: xml, multipart: multipart };
        }

        if (window.JmsJmxExportCompact) {
            xml += window.JmsJmxExportCompact.httpEmptyBodyArgs(indent + '  ');
        } else {
            xml += indent + '  <boolProp name="HTTPSampler.postBodyRaw">false</boolProp>\n';
            xml += indent + '  <elementProp name="HTTPsampler.Arguments" elementType="Arguments" guiclass="HTTPArgumentsPanel" testclass="Arguments" testname="User Defined Variables" enabled="true">\n';
            xml += indent + '    <collectionProp name="Arguments.arguments"/>\n';
            xml += indent + '  </elementProp>\n';
        }
        return { xml: xml, multipart: false };
    }

    function parseCurlToStep(curlText) {
        var raw = String(curlText || '').trim();
        if (!raw) throw new Error('curl 内容为空');
        raw = raw.replace(/\\\r?\n/g, ' ');
        var tokens = raw.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || [];
        var ti = 0;
        if (ti < tokens.length && /^curl$/i.test(tokens[ti])) ti++;
        var url = '';
        var method = 'GET';
        var headers = {};
        var body = null;
        while (ti < tokens.length) {
            var t = tokens[ti];
            if (t === '-X' || t === '--request') { method = tokens[++ti].replace(/^["']|["']$/g, '').toUpperCase(); ti++; continue; }
            if (t === '-H' || t === '--header') {
                var hv = tokens[++ti].replace(/^["']|["']$/g, '');
                var ci = hv.indexOf(':');
                if (ci > 0) headers[hv.slice(0, ci).trim()] = hv.slice(ci + 1).trim();
                ti++; continue;
            }
            if (t === '-d' || t === '--data' || t === '--data-raw' || t === '--data-binary') {
                body = tokens[++ti].replace(/^["']|["']$/g, '');
                if (method === 'GET') method = 'POST';
                ti++; continue;
            }
            if (!t.startsWith('-')) { url = t.replace(/^["']|["']$/g, ''); ti++; continue; }
            ti++;
        }
        if (!url) throw new Error('未能解析 URL');
        var u = new URL(url);
        var stepPath = u.pathname || '/';
        if (window.JmsHttpPathQuery) stepPath = window.JmsHttpPathQuery.appendSearchToPath(stepPath, u.search);
        else if (u.search) stepPath += u.search;
        var step = {
            name: (method + ' ' + u.pathname).slice(0, 48),
            method: method,
            path: stepPath,
            headers: headers,
            assert_status: 200
        };
        if (body !== null) {
            step.body = body;
            step.body_type = 'json';
            step.body_content_mode = 'json';
        }
        return { base_url: u.origin, step: step };
    }

    function parseStepYaml(text) {
        var parsed = jsyaml.load(text);
        if (parsed && parsed.method && parsed.path) return parsed;
        if (Array.isArray(parsed) && parsed[0]) return parsed[0];
        throw new Error('Step 格式无效，需要包含 method 与 path');
    }

    function mergeStepIntoYaml(step, baseUrlHint) {
        var data;
        try { data = jsyaml.load(yamlInput.value) || {}; } catch (e) { data = {}; }
        if (baseUrlHint && !data.base_url) data.base_url = baseUrlHint;
        if (Array.isArray(data.thread_groups) && data.thread_groups.length) {
            var tg0 = data.thread_groups[0];
            if (!tg0.steps) tg0.steps = [];
            tg0.steps.push(step);
        } else if (Array.isArray(data.test_plans) && data.test_plans.length) {
            var plan = data.test_plans[0];
            if (Array.isArray(plan.thread_groups) && plan.thread_groups.length) {
                var tg = plan.thread_groups[0];
                if (!tg.steps) tg.steps = [];
                tg.steps.push(step);
            } else {
                if (!plan.steps) plan.steps = [];
                plan.steps.push(step);
            }
        } else {
            if (!data.steps) data.steps = [];
            data.steps.push(step);
        }
        yamlInput.value = jsyaml.dump(data, { lineWidth: 120, noRefs: true });
        syncPanelsFromYaml();
        if (window.JmsVisualBuilder) JmsVisualBuilder.loadTemplate(yamlInput.value);
    }

    function buildStepFromQuickForm() {
        var urlRaw = (document.getElementById('qa-url').value || '').trim();
        if (!urlRaw) throw new Error('请填写接口 URL');
        var u = new URL(/^https?:\/\//i.test(urlRaw) ? urlRaw : 'https://' + urlRaw);
        var method = document.getElementById('qa-method').value;
        var token = (document.getElementById('qa-token').value || '').trim();
        var bodyRaw = (document.getElementById('qa-body').value || '').trim();
        var headers = {};
        if (token) headers.Authorization = 'Bearer ' + token;
        if (bodyRaw && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
        var stepPath2 = u.pathname || '/';
        if (window.JmsHttpPathQuery) stepPath2 = window.JmsHttpPathQuery.appendSearchToPath(stepPath2, u.search);
        else if (u.search) stepPath2 += u.search;
        var step = {
            name: (method + ' ' + u.pathname).slice(0, 48),
            method: method,
            path: stepPath2,
            headers: headers,
            assert_status: 200
        };
        if (method !== 'GET' && method !== 'HEAD' && bodyRaw) step.body = bodyRaw;
        if (!Object.keys(headers).length) delete step.headers;
        return { base_url: u.origin, step: step };
    }

                        window.JmxImportModalUi.renderSummary(sum, result.summary);
                    } else {
                        sum.textContent = window.JmxScenarioAdvanced
                            ? window.JmxScenarioAdvanced.formatImportReport(result.summary)
                            : ('计划「' + result.summary.planName + '」：' + result.summary.threadGroups + ' 个线程组，' + result.summary.steps + ' 个 HTTP 步骤');

        }
    });

    (function initJmxImportUi() {
        var modal = document.getElementById('modal-jmx-import');
        var drop = document.getElementById('jmx-import-drop');
        var fileInput = document.getElementById('jmx-import-file');
        if (!drop || !fileInput) return;

        drop.addEventListener('click', function () { fileInput.click(); });
        drop.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fileInput.click(); }
        });
        fileInput.addEventListener('change', function () {
            if (fileInput.files && fileInput.files[0]) handleJmxFileSelected(fileInput.files[0]);
        });
        drop.addEventListener('dragover', function (ev) {
            ev.preventDefault();
            drop.classList.add('is-dragover');
        });
        drop.addEventListener('dragleave', function () { drop.classList.remove('is-dragover'); });
        drop.addEventListener('drop', function (ev) {
            ev.preventDefault();
            drop.classList.remove('is-dragover');
            var f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
            if (f) handleJmxFileSelected(f);
        });
        if (modal) {
            modal.addEventListener('click', function (ev) {
                if (ev.target === modal) closeJmxImportModal();
            });
        }
    })();

    bindClick('btn-output-close', closeOutputModal);
    var modalOutput = document.getElementById('modal-output');
    if (modalOutput) {
        modalOutput.addEventListener('click', function (ev) {
            if (ev.target === modalOutput) closeOutputModal();
        });
    }
    document.querySelectorAll('#modal-output .tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { setTab(btn.getAttribute('data-tab')); });
    });
    bindClick('btn-copy', copyCurrentTab);
    bindClick('btn-download-file', downloadCurrentTab);

    bindClick('btn-quick-add', function () {
        try {
            var r = buildStepFromQuickForm();
            mergeStepIntoYaml(r.step, r.base_url);
            markScenarioDirty();
            showMsg('已添加 Step：' + r.step.name, true);
        } catch (e) { showMsg(e.message || String(e), false); }
    });

    if (yamlInput) {
        try { sessionStorage.removeItem('testhub.jmeter_scenario.yaml'); } catch (e) {}
        applyScenarioYaml(TEMPLATES.order);
    }

window.JmsScenarioStudio = window.JmsScenarioStudio || {};
    window.JmsScenarioStudio.openHttpAddChoiceModal = openHttpAddChoiceModal;
    window.JmsScenarioStudio.closeHttpAddChoiceModal = closeHttpAddChoiceModal;
    window.JmsScenarioStudio.openImportModal = openImportModal;
    window.JmsScenarioStudio.applyScenarioYaml = applyScenarioYaml;
    window.JmsScenarioStudio.clearDirtyState = function () {
        scenarioUserEdited = false;
        var wrap = document.getElementById('tpl-select-wrap');
        if (wrap) wrap.classList.remove('hidden');
        var sel = document.getElementById('tpl-select');
        if (sel) sel.value = 'order';
    };
    window.JmsScenarioStudio.isDirty = function () {
        return !!scenarioUserEdited;
    };
    window.JmsScenarioStudio.clearGeneratedState = function () {
        lastScenario = null;
        lastOutputs = { jmx: '', readme: '', scenarioSlug: '' };
        _jmxImportParsedYaml = null;
        _jmxImportParsedScenario = null;
        _jmxImportRawBundle = null;
        if (outJmx) outJmx.textContent = '';
        if (outReadme) outReadme.textContent = '';
        if (summaryBox) summaryBox.classList.add('hidden');
        if (summaryList) summaryList.innerHTML = '';
        if (window.JmsVisualBuilder && typeof JmsVisualBuilder.setRawJmxBundle === 'function') {
            JmsVisualBuilder.setRawJmxBundle(null);
        }
    };
    if (window.JmsVisualBuilder) {
        JmsVisualBuilder.init({
            yamlInput: yamlInput,
            syncPanelsFromYaml: syncPanelsFromYaml,
            showMsg: showMsg,
            updateValidateButtonLabel: updateValidateButtonLabel,
            openImportModal: openImportModal,
            openHttpAddChoiceModal: openHttpAddChoiceModal,
            showConfirm: showJmsConfirmDialog,
            markScenarioDirty: markScenarioDirty
        });
        updateValidateButtonLabel();
    }

    if (window.JmsScenarioStudioReset && typeof window.JmsScenarioStudioReset.bind === 'function') {
        window.JmsScenarioStudioReset.bind({
            applyYaml: applyScenarioYaml,
            clearDirtyState: window.JmsScenarioStudio.clearDirtyState,
            clearGeneratedState: window.JmsScenarioStudio.clearGeneratedState,
            showMsg: showMsg,
            showConfirm: showJmsConfirmDialog
        });
    }

})();
});
</script>
