{# 生成批次条：固定放在右侧表格工具栏下方 #}
<div id="tc-gen-batch-bar" class="tc-gen-batch-bar hidden" aria-live="polite">
    <div class="tc-gen-batch-bar__main">
        <div class="tc-gen-batch-bar__info">
            <span id="tc-gen-batch-title" class="tc-gen-batch-bar__title">本次生成</span>
            <span id="tc-gen-batch-meta" class="tc-gen-batch-bar__meta"></span>
        </div>
    </div>
    <div class="tc-gen-batch-bar__actions">
        <button type="button" id="tc-gen-batch-close-btn" class="tc-gen-batch-bar__close" title="关闭批次条" aria-label="关闭批次条">✕</button>
    </div>
</div>
