{# 内网模型配置弹窗 — 用例生成 / Excel 润色共用 #}
<div id="tc-preset-model-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/40 p-4" role="dialog" aria-modal="true" aria-labelledby="tc-preset-model-modal-title">
    <div class="relative w-full max-w-sm rounded-xl bg-white p-4 shadow-2xl sm:p-5">
        <h3 id="tc-preset-model-modal-title" class="text-base font-semibold text-gray-900">内网模型</h3>
        <div class="mt-3 grid grid-cols-1 gap-2.5">
            <div>
                <label class="tc-preset-modal__label" for="tc-preset-modal-base-url">Base URL</label>
                <input type="text" id="tc-preset-modal-base-url" class="form-input tc-preset-modal__input" placeholder="http://host:port/v1">
            </div>
            <div>
                <label class="tc-preset-modal__label" for="tc-preset-modal-api-key">API Key</label>
                <input type="text" id="tc-preset-modal-api-key" class="form-input tc-preset-modal__input" placeholder="密钥">
            </div>
            <div>
                <label class="tc-preset-modal__label" for="tc-preset-modal-model">模型</label>
                <input type="text" id="tc-preset-modal-model" class="form-input tc-preset-modal__input" placeholder="模型名">
            </div>
        </div>
        <div class="mt-4 flex justify-end gap-2">
            <button type="button" id="tc-preset-model-cancel-btn" class="btn btn-secondary text-sm py-1.5 px-3">取消</button>
            <button type="button" id="tc-preset-model-save-btn" class="btn btn-primary text-sm py-1.5 px-3">保存</button>
        </div>
    </div>
</div>
