{# 测试用例页视口级弹窗与 Toast；须挂在 main 外；仅 tc_view 时 include #}
    <!-- 视口级提示：必须挂在 main 外，避免祖先 transform 导致 fixed 相对错位、弹窗贴顶 -->
    <div id="tc-app-dialog" class="tc-app-dialog-root fixed inset-0 z-[10350] hidden p-4 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="tc-app-dialog-title">
        <div class="tc-app-dialog__scrim absolute inset-0 bg-slate-950/55 backdrop-blur-[3px]" aria-hidden="true"></div>
        <div class="tc-app-dialog__panel relative w-full max-w-[26rem] overflow-hidden rounded-2xl shadow-[0_24px_64px_-12px_rgba(15,23,42,0.35)] ring-1 ring-slate-400/20" onclick="event.stopPropagation()">
            <div class="tc-app-dialog__accent" aria-hidden="true"></div>
            <div class="tc-app-dialog__body px-6 pb-2 pt-7 sm:px-8 sm:pt-8">
                <div class="tc-app-dialog__body-inner">
                    <div id="tc-app-dialog-icon" class="tc-app-dialog-icon tc-app-dialog-icon--info mb-4 flex h-14 w-14 items-center justify-center rounded-2xl text-lg font-bold tracking-tight" aria-hidden="true">i</div>
                    <h3 id="tc-app-dialog-title" class="text-[1.0625rem] font-semibold leading-snug text-slate-900">提示</h3>
                    <p id="tc-app-dialog-message" class="tc-app-dialog-message mt-3 text-[0.9375rem] leading-relaxed text-slate-600"></p>
                    <p id="tc-app-dialog-hint" class="mt-3 hidden text-xs font-medium leading-relaxed text-slate-500"></p>
                </div>
            </div>
            <div class="tc-app-dialog__footer flex flex-col-reverse gap-2.5 border-t border-slate-300/25 bg-slate-200/25 px-6 py-4 sm:flex-row sm:justify-center sm:gap-3 sm:px-8">
                <button type="button" id="tc-app-dialog-cancel" class="tc-app-dialog__btn tc-app-dialog__btn--secondary hidden w-full sm:w-auto">取消</button>
                <button type="button" id="tc-app-dialog-confirm" class="tc-app-dialog__btn tc-app-dialog__btn--primary w-full sm:w-auto">知道了</button>
            </div>
        </div>
    </div>
    <div id="tc-template-modal" class="tc-template-modal fixed inset-0 z-[75] hidden items-center justify-center bg-black/40 p-4" role="dialog" aria-modal="true" aria-labelledby="tc-template-modal-title">
        <div class="tc-template-modal__panel relative flex max-h-[90vh] w-full max-w-md flex-col overflow-hidden rounded-2xl bg-white shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex shrink-0 items-center justify-between gap-3 border-b border-slate-100 px-5 py-3 sm:px-6">
                <h3 id="tc-template-modal-title" class="text-base font-semibold text-slate-900">选择模板</h3>
                <button type="button" id="tc-template-modal-close" class="shrink-0 rounded-full p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-600" aria-label="关闭">✕</button>
            </div>
            <div class="min-h-0 flex-1 overflow-y-auto px-5 py-4 sm:px-6">
                <div id="tc-template-modal-grid" class="tc-template-modal__list" role="list"></div>
            </div>
        </div>
    </div>

    <div id="tc-app-toast" class="pointer-events-none fixed bottom-8 left-1/2 z-[90] w-[min(92vw,22rem)] -translate-x-1/2 translate-y-3 opacity-0 transition-all duration-300 ease-out" role="status" aria-live="polite">
        <div id="tc-app-toast-inner" class="tc-app-toast__inner text-center text-[0.8125rem] font-medium leading-snug shadow-lg"></div>
    </div>
