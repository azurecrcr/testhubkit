<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 · {{ hf_site_brand_title }}</title>
    {% include 'partials/hf_favicon.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/toolkit.css') }}?v=20260556">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/page_shells.css') }}?v=20260556">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/account_profile_chrome.css') }}?v=20260724bind1">
    <script src="{{ url_for('static', filename='vendor/tailwindcss-cdn-3.4.10.js') }}"></script>
</head>
<body class="min-h-screen account-profile-page account-password-page">
    {% include 'partials/hf_global_nav.html' %}
    <div class="profile-page__bg" aria-hidden="true">
        <div class="profile-page__bg-orb profile-page__bg-orb--a"></div>
        <div class="profile-page__bg-orb profile-page__bg-orb--b"></div>
        <div class="profile-page__bg-orb profile-page__bg-orb--c"></div>
        <div class="profile-page__bg-grid"></div>
    </div>
    <div class="pwd-wrap">
        <div class="pwd-card">
            <header class="pwd-card__head">
                <h1>修改密码</h1>
                <p class="pwd-card__lead" id="pwd-sub">验证通过后即可设置新密码。</p>
            </header>

            <div id="pwd-channel-switch" class="auth-type-switch pwd-channel-switch is-hidden" role="group" aria-label="验证方式">
                <button type="button" class="auth-type-switch__btn is-active" data-pwd-channel="sms">短信验证码</button>
                <button type="button" class="auth-type-switch__btn" data-pwd-channel="email">邮箱验证码</button>
            </div>

            <label class="pwd-field">
                <span class="pwd-field__label" id="pwd-account-label">登录账号</span>
                <input type="text" id="pwd-account" readonly autocomplete="username">
            </label>

            <label class="pwd-field">
                <span class="pwd-field__label">图形验证码</span>
                <div class="pwd-row">
                    <span class="pwd-captcha-q" id="pwd-captcha-q" aria-live="polite">…</span>
                    <input id="pwd-captcha-a" type="text" inputmode="numeric" placeholder="计算结果" aria-label="图形验证码答案" autocomplete="off">
                    <button type="button" class="pwd-btn" id="pwd-captcha-refresh">换一题</button>
                </div>
            </label>

            <label class="pwd-field">
                <span class="pwd-field__label" id="pwd-code-label">验证码</span>
                <div class="pwd-row">
                    <input id="pwd-code" type="text" inputmode="numeric" maxlength="8" placeholder="验证码" aria-label="验证码" autocomplete="one-time-code">
                    <button type="button" class="pwd-btn" id="pwd-send-code">获取验证码</button>
                </div>
            </label>
            <p class="pwd-hint" id="pwd-hint">验证码约 5～10 分钟内有效。</p>

            <label class="pwd-field">
                <span class="pwd-field__label">新密码</span>
                <input id="pwd-new" type="password" autocomplete="new-password" placeholder="至少 8 位" minlength="8">
            </label>
            <label class="pwd-field">
                <span class="pwd-field__label">确认新密码</span>
                <input id="pwd-confirm" type="password" autocomplete="new-password" placeholder="再次输入新密码" minlength="8">
            </label>

            <div class="pwd-actions">
                <a href="/account/profile" class="pwd-btn--ghost">返回资料</a>
                <button type="button" class="pwd-btn pwd-btn--primary" id="pwd-submit">确认修改</button>
            </div>
            <p id="pwd-msg" class="pwd-msg" aria-live="polite"></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/hf_auth_nav.js') }}?v=20260622logouttree2"></script>
    <script src="{{ url_for('static', filename='js/hf_float_toast.js') }}?v=20260611toast1"></script>
    <script src="{{ url_for('static', filename='js/hf_account_password_page.js') }}?v=20260724bind1"></script>
    {% include 'partials/hf_site_footer.html' %}
</body>
</html>
