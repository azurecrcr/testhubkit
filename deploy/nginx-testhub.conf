worker_processes auto;
# Docker 默认 symlink(stdout/stderr) + 宿主机挂载文件双写，便于 ≥180 天留存
error_log /var/log/nginx/error.log warn;
error_log /var/log/nginx-testhub/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
    map $http_upgrade $proxy_connection {
        default upgrade;
        "" close;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 1000;

    # 访问日志：只写挂载目录（≥180 天轮转），带缓冲避免高并发同步写盘拖慢接口
    access_log /var/log/nginx-testhub/access.log combined buffer=512k flush=5s;

    open_file_cache max=20000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml;

    # Docker 内置 DNS：testhub 容器重建后 IP 会变，静态 upstream 会缓存旧 IP 导致 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # IP 或未知 Host → 正式域名 HTTPS
    server {
        listen 80 default_server;
        server_name _;
        return 301 https://testhubkit.com$request_uri;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name testhubkit.com www.testhubkit.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name testhubkit.com www.testhubkit.com;

        ssl_certificate /etc/nginx/certs/www.testhubkit.com.pem;
        ssl_certificate_key /etc/nginx/certs/www.testhubkit.com.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        client_max_body_size 50m;
        http2_max_concurrent_streams 128;

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # 交流群微信二维码：uploads 直出，不经 Flask，避免挤占应用连接
        location /community-qr/ {
            alias /var/www/community-qr/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        location ~ ^/api/test-cases/(agent-jobs|generation-sessions)/[^/]+/stream$ {
            set $testhub_upstream http://testhub:5000;
            proxy_pass $testhub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding off;
        }


        location = /api/test-cases/attachments/edit-prepare-context {
            set $testhub_upstream http://testhub:5000;
            proxy_pass $testhub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            client_body_timeout 120s;
            send_timeout 900s;
        }

        location = /api/doc-tools/chat/stream {
            set $testhub_upstream http://testhub:5000;
            proxy_pass $testhub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding off;
        }

        location = /api/test-cases/smart-edit/stream {
            set $testhub_upstream http://testhub:5000;
            proxy_pass $testhub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding off;
        }

        # AI 对照流：与前端 300s 墙钟对齐，略留余量；块间超时保护上游
        location = /api/test-cases/validate/llm-stream {
            set $testhub_upstream http://testhub:5000;
            proxy_pass $testhub_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 660s;
            proxy_read_timeout 660s;
            chunked_transfer_encoding off;
        }

        location / {
            set $testhub_upstream http://testhub:5000;
            proxy_pass $testhub_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
